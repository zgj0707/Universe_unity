<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>星轨纪行：出发去月球！</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#F6EFE3;}
  #unity-canvas{position:fixed;left:0;top:0;width:100vw;height:100vh;display:block;background:#F6EFE3;outline:none;}
  #loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:#F6EFE3;color:#3A2E22;font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;z-index:10;}
  #loading h1{font-size:22px;font-weight:600;letter-spacing:2px;margin:0 0 18px;}
  #bar{width:220px;height:8px;border-radius:4px;background:#EADFCB;overflow:hidden;}
  #fill{width:0%;height:100%;background:#6FA05A;transition:width .2s;}
  #tip{margin-top:14px;font-size:12px;color:#8A7A66;}
</style>
</head>
<body>
<canvas id="unity-canvas" tabindex="-1"></canvas>
<div id="loading"><h1>星轨纪行：出发去月球！</h1><div id="bar"><div id="fill"></div></div><div id="tip">正在校准星际航道…</div></div>
<script src="Build/WebGL.loader.js"></script>
<script>
  var canvas = document.querySelector("#unity-canvas");
  // 与竖屏设计分辨率相近的像素预算，避免高 DPI 手机以数倍像素绘制整屏。
  var pixelBudget = 1080 * 1920;
  var viewportPixels = Math.max(1, window.innerWidth * window.innerHeight);
  var renderDpr = Math.min(window.devicePixelRatio || 1, 2, Math.sqrt(pixelBudget / viewportPixels));
  createUnityInstance(canvas, {
    dataUrl: "Build/WebGL.data.unityweb",
    frameworkUrl: "Build/WebGL.framework.js.unityweb",
    codeUrl: "Build/WebGL.wasm.unityweb",
    companyName: "深空轨社",
    productName: "星轨纪行：出发去月球！",
    productVersion: "0.1",
    devicePixelRatio: renderDpr
  }, function (progress) {
    document.querySelector("#fill").style.width = Math.round(progress * 100) + "%";
  }).then(function (instance) {
    window.unityInstance = instance;
    var l = document.querySelector("#loading"); if (l) l.style.display = "none";
  }).catch(function (err) {
    document.querySelector("#tip").textContent = "加载失败：" + err;
    console.error(err);
  });
</script>
</body>
</html>
